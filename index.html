<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div>
        <h1>Rock Paper Scissors</h1>
        <p>Do you have what it takes to defeat the evil AI?</p>
    </div>
    <div class = 'images'>
        <div id = 'rockDiv'>
            <img src = '' alt = 'rock'>
        </div>
        <div id = 'paperDiv'></div>
            <img src = '' alt = 'paper'>
        <div id = 'scissorsDiv'></div>
            <img src = '' alt = 'scissors'>
    </div>
    <div class = 'ui'>
        <span id = 'playerUI'>
            <h2>Player Score</h2>
            <p id = 'paraPlayerScore'></p>
            <button id = 'rock'>Rock</button>
            <button id = 'paper'>Paper</button>
            <button id = 'scissors'>Scissors</button>
        </span>
        <span id = 'aiUI'>
            <h2>AI Score</h2>
            <p id = 'paraAiScore'></p>
        </span>
    </div>
    <script src="./script.js"></script>
</body>
</html>
